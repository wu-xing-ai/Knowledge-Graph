# =============================================================
# 知联汇学 Docker 部署（推荐用 scripts/docker-deploy.sh 启动）
# 用法：docker compose up -d --build
# 变量来自仓库根目录 .env（或 shell 环境变量），可被 docker-deploy.sh 自动填充
# =============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: zhi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-wjx1314520}
      MYSQL_DATABASE: zhi_platform
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"      # 仅本机可访问，调试用
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_PASSWORD:-wjx1314520}"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5-community
    container_name: zhi-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      TZ: Asia/Shanghai
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"      # Neo4j Browser（仅本机）
      - "127.0.0.1:7687:7687"      # Bolt（仅本机）
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-neo4j} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  model-service:
    build: ./model-service
    image: zhi-model-service:latest
    container_name: zhi-model-service
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 云端 LLM（魔搭 ModelScope）
      MODELSCOPE_API_KEY: ${MODELSCOPE_API_KEY:-}
      LLM_BASE_URL: https://api-inference.modelscope.cn/v1
      LLM_MODEL: MiniMax/MiniMax-M1-80k
      # 云端 OCR（AI Studio PaddleOCR）
      PADDLE_OCR_TOKEN: ${PADDLE_OCR_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"     # 模型微服务（仅本机，供后端内部调用）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    image: zhi-backend:latest
    container_name: zhi-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      model-service:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhi_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-wjx1314520}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      JWT_SECRET: ${JWT_SECRET:-zhiplatform_docker_dev_secret_change_me_1234567890}
      MODEL_SERVICE_URL: http://model-service:8000
    ports:
      - "127.0.0.1:8080:8080"      # 后端 API（仅本机，对外走 nginx）

  frontend:
    build: ./frontend
    image: zhi-frontend:latest
    container_name: zhi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"                    # 对外唯一入口

volumes:
  mysql-data:
  neo4j-data: