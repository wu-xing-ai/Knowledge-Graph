server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zhi_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

# ============ 登录开关（演示模式）============
# AUTH_ENABLED   是否要求登录鉴权：true=正常登录（默认）；false=演示模式（免登录浏览）
#                演示模式下未携带 token 的请求自动使用演示账号身份（controllers 中的 Principal 仍可用）
# DEMO_USERNAME  演示模式使用的账号，默认 admin；须为 sys_user 中已存在且启用的用户名，
#                不存在时自动回退到系统中第一个启用的管理员
app:
  auth:
    enabled: ${AUTH_ENABLED:true}
    demo-username: ${DEMO_USERNAME:admin}

logging:
  level:
    com.zhiplatform: info
# ============ 模型微服务（Python FastAPI）============
# LLM / OCR 能力统一由 model-service 提供：
#   - POST /v1/chat/completions（OpenAI 兼容，转发魔搭 ModelScope / 本地 Ollama）
#   - POST /v1/ocr（转发云端 PaddleOCR）
# 云端密钥在 model-service 侧通过环境变量 MODELSCOPE_API_KEY / PADDLE_OCR_TOKEN 配置，Java 不再持有密钥
model-service:
  base-url: ${MODEL_SERVICE_URL:http://localhost:8000}
  llm-model: ${LLM_MODEL:MiniMax/MiniMax-M1-80k}
  timeout-seconds: 240

