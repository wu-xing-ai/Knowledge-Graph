server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/zhi_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:wjx1314520}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:neo4j}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:ZhiPlatformSecretKey2024ForJWTTokenGenerationMustBeLongEnough}
  expiration: 86400000

logging:
  level:
    com.zhiplatform: info
# 云端 PaddleOCR（AI Studio），用于扫描件/图片 OCR
# 建议用环境变量 PADDLE_OCR_TOKEN 覆盖，避免密钥写入公开仓库
paddle-ocr:
  job-url: https://paddleocr.aistudio-app.com/api/v2/ocr/jobs
  token: ${PADDLE_OCR_TOKEN:}
  model: PaddleOCR-VL-1.6
# 魔搭 ModelScope 云端 LLM（文档知识抽取），key 从 .env 的 MODELSCOPE_API_KEY 读取
modelscope:
  base-url: https://api-inference.modelscope.cn/v1
  api-key: ${MODELSCOPE_API_KEY:}
  model: MiniMax/MiniMax-M1-80k
  timeout-seconds: 240

