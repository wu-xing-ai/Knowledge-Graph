# 知联汇学知识图谱平台 —— Cloudflare 接入版 Nginx 配置
# 用法：替换服务器上的 /etc/nginx/conf.d/zhi-platform.conf
# 证书：Cloudflare Origin Certificate（SSL/TLS → Origin Server 生成）
#   证书保存到 /etc/nginx/ssl/xinxin.dpdns.org.pem
#   私钥保存到 /etc/nginx/ssl/xinxin.dpdns.org.key（chmod 600）

# ---- 还原 Cloudflare 代理后的真实客户端 IP（操作日志/限流用）----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---- 域名访问：HTTP 跳转 HTTPS（Cloudflare 边缘也会跳，这里是兜底）----
server {
    listen 80;
    server_name knowledgegraph.xinxin.dpdns.org xinxin.dpdns.org;

    # 仅 ACME 验证与跳转
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---- 保留 IP 直访（http://101.33.233.99 维持现状，不受影响）----
server {
    listen 80;
    server_name 101.33.233.99;

    root /opt/zhi-platform/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}

# ---- 主站：HTTPS ----
server {
    listen 443 ssl http2;
    server_name knowledgegraph.xinxin.dpdns.org xinxin.dpdns.org;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/xinxin.dpdns.org.pem;
    ssl_certificate_key /etc/nginx/ssl/xinxin.dpdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 前端静态文件（install.sh 部署位置）
    root /opt/zhi-platform/frontend;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（同源，无跨域问题）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 50m;      # 允许上传大文档
        proxy_read_timeout 300s;       # OCR/LLM 抽取可能较慢
        proxy_send_timeout 300s;

        proxy_buffering off;           # 关键：智能问答 SSE 流式输出必须关闭缓冲
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}

# ---- Cloudflare 回源专用：8880 非标端口（配合 CF Origin Rule 端口改写）----
server {
    listen 8880;
    server_name knowledgegraph.xinxin.dpdns.org;

    root /opt/zhi-platform/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;      # 智能问答 SSE 流式输出
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
